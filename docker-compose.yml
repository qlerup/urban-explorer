services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbanexplorer
      POSTGRES_USER: urbanexplorer
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanexplorer -d urbanexplorer"]
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: urban-explorer-valhalla
    restart: unless-stopped
    environment:
      # Hent og byg kun Danmark. Første start bygger routing-grafen; derefter
      # genbruges data fra valhalla_data-volume.
      tile_urls: https://download.geofabrik.de/europe/denmark-latest.osm.pbf
      serve_tiles: "True"
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      force_rebuild_elevation: "False"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_tar: "True"
      server_threads: "2"
    volumes:
      - valhalla_data:/custom_files

  app:
    container_name: urban-explorer
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://urbanexplorer:${DB_PASSWORD}@db:5432/urbanexplorer
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAPTILER_KEY: ${MAPTILER_KEY:-}
      DATAFORSYNINGEN_TOKEN: ${DATAFORSYNINGEN_TOKEN:-}
      VALHALLA_URL: http://valhalla:8002
      NODE_ENV: production
      TZ: ${TZ:-Europe/Copenhagen}
      FJORDHUB_URL: ${FJORDHUB_URL:-}
      FJORDHUB_APP_ID: ${FJORDHUB_APP_ID:-urban-explorer}
      FJORDHUB_API_KEY: ${FJORDHUB_API_KEY:-}
    volumes:
      - ${UPLOADS_HOST_DIR:-uploads_data}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_started

volumes:
  postgres_data:
  uploads_data:
  valhalla_data:
